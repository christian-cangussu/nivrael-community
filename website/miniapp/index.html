<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nivrael</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: 'Noto Sans', system-ui, sans-serif;
      background: #06080f;
      color: #e2eaff;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── Realm colour tokens ──────────────────────────── */
    :root {
      --realm-0: #9ca3af;  /* Mortal */
      --realm-1: #60a5fa;  /* Qi Condensation */
      --realm-2: #fbbf24;  /* Foundation */
      --realm-3: #a855f7;  /* Core Formation */
      --realm-4: #2dd4bf;  /* Nascent Soul */
      --realm-5: #3b82f6;  /* Spirit Transformation */
      --realm-6: #8b5cf6;  /* Void Refinement */
      --realm-7: #f59e0b;  /* Body Integration */
      --realm-8: #38bdf8;  /* Mahayana */
      --realm-9: #eab308;  /* Half-Immortal */
      --realm-10:#f472b6;  /* True Immortal */

      --bg:       #06080f;
      --card:     #0d1422;
      --panel:    #111d35;
      --border:   #1e3060;
      --border2:  #253f7a;
      --text:     #e2eaff;
      --muted:    #6e89bf;
      --muted2:   #3d5a9e;
      --gold:     #c9903a;
      --jade:     #3ecf7e;
      --red:      #e5534b;
      --warn:     #f59e0b;
    }

    /* ── Keyframes ────────────────────────────────────── */
    @keyframes orb-pulse {
      0%,100% { transform: scale(1);    opacity: .85; }
      50%      { transform: scale(1.06); opacity: 1;   }
    }
    @keyframes orb-ring {
      0%   { transform: scale(.9); opacity: .5; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes particle-float {
      0%   { transform: translateY(0)   translateX(0)   scale(1);   opacity: .7; }
      100% { transform: translateY(-90px) translateX(var(--dx,15px)) scale(0); opacity: 0; }
    }
    @keyframes bar-fill {
      from { width: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes tick-glow {
      0%,100% { box-shadow: 0 0 8px 2px currentColor; }
      50%      { box-shadow: 0 0 20px 6px currentColor; }
    }

    /* ── Scrollable content area ──────────────────────── */
    .screen-scroll {
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      height: 100%;
      padding-bottom: 76px;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }

    /* ── Cards / Panels ───────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .card-sm {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    /* ── Progress bar ─────────────────────────────────── */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,.07);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      animation: bar-fill .8s ease both;
    }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: 'Noto Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: .3px;
    }
    .btn:active { transform: scale(.96); opacity: .85; }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,58,237,.35);
    }
    .btn-gold {
      background: linear-gradient(135deg, #92600a, #c9903a);
      color: #fff5dc;
      box-shadow: 0 4px 16px rgba(201,144,58,.25);
    }
    .btn-ghost {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border2);
      color: var(--muted);
    }
    .btn-danger {
      background: linear-gradient(135deg, #7f1d1d, #e5534b);
      color: #fff;
    }
    .btn-jade {
      background: linear-gradient(135deg, #065f46, #3ecf7e);
      color: #e0fff0;
    }

    /* ── Badge / chip ─────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid;
    }

    /* ── Section header ───────────────────────────────── */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Bottom Nav ───────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(9,12,24,.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 0 4px;
      transition: opacity .15s;
    }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 9px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
    .nav-item.active .nav-label { color: var(--text); }
    .nav-item:not(.active) .nav-label { color: var(--muted2); }
    .nav-item:not(.active) .nav-icon { filter: grayscale(.6) opacity(.5); }

    /* ── Floating top header ──────────────────────────── */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6,8,15,.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Qi Orb ───────────────────────────────────────── */
    .orb-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto;
    }
    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: orb-pulse 3s ease-in-out infinite;
    }
    .orb-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid;
      animation: orb-ring 2.5s ease-out infinite;
    }
    .orb-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      bottom: 50%;
      left: 50%;
      animation: particle-float 2.5s ease-out infinite;
    }

    /* ── List items ───────────────────────────────────── */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
    }

    /* ── Stat grid ────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: .5px; text-transform: uppercase; }
    .stat-value { font-size: 18px; font-weight: 600; margin-top: 2px; }

    /* ── Screen fade ──────────────────────────────────── */
    .screen-fade { animation: fade-in .25s ease both; }

    /* ── Meditation timer ─────────────────────────────── */
    .med-timer {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
    }

    /* ── World feed entry ─────────────────────────────── */
    .feed-entry {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .feed-entry:last-child { border-bottom: none; }
    .feed-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    /* ── Dungeon card ─────────────────────────────────── */
    .dungeon-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .diff-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── Achievement ──────────────────────────────────── */
    .achievement {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .achievement-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ── Shimmer loading ──────────────────────────────── */
    .shimmer {
      background: linear-gradient(90deg, var(--panel) 25%, var(--border) 50%, var(--panel) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─────────────────────────────────────────────────────────
// CONFIG — change API_BASE to your bot domain when ready
// ─────────────────────────────────────────────────────────

  new URLSearchParams(window.location.search).get("api_base") ||

const REALM_COLORS = [
  "#9ca3af","#60a5fa","#fbbf24","#a855f7","#2dd4bf",
  "#3b82f6","#8b5cf6","#f59e0b","#38bdf8","#eab308","#f472b6"
];

const SUB_LABELS = ["","I","II","III","IV","V","VI","VII","VIII","IX"];

// ─────────────────────────────────────────────────────────
// MOCK PLAYER — substituído por dados reais da API
// ─────────────────────────────────────────────────────────
const MOCK_PLAYER = {
  dao_name: "Ardens Voidwalker",
  realm: 6, sub_layer: 3,

  cb: 2480000, cb_threshold: 2800000,

  spirit_stones: 45230, spirit_jade: 150,
  prestige: 0, prestige_title: null,
  meditation_type: "deep",

  daily_quests: [
    { name: "Meditar 30 min", done: true, progress: null },
    { name: "Completar 2 masmorras", done: false, progress: "1/2" },
    { name: "Criar 3 pills", done: false, progress: "2/3" },
    { name: "Doar à sect vault", done: false, progress: null },
  ],
  world_feed: [
    { msg: "World Boss 'Azure Tyrant' apareceu!", time: "18:00", type: "boss" },
    { msg: "Sect Eclipse conquistou Celestial Peak", time: "17:42", type: "sect" },
    { msg: "Yun_Ming atingiu Mahayana IX", time: "16:13", type: "player" },

  ],
  dungeons: [

  techniques: [

    { name: "Elder da Sect", icon: "🏛️", done: true, desc: "Tornou-se Elder" },
    { name: "Caçador de Bosses", icon: "🐲", done: false, desc: "Derrotou 10 world bosses" },
    { name: "Imortal", icon: "🌸", done: false, desc: "Atingiu True Immortal" },
  ],
  cauldron: "Azure Lotus Furnace",

  weapon: "Starfall Blade +7",
  armor: "Void Silk Robe +5",
};

// ─────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return String(n);
}

function pct(a, b) { return Math.min(100, Math.round(a / b * 100)); }

function useTimer(startedAt, active) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    if (!active || !startedAt) return;
    const update = () => setElapsed(Date.now() - startedAt);
    update();
    const id = setInterval(update, 1000);
    return () => clearInterval(id);
  }, [startedAt, active]);
  const s = Math.floor(elapsed / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

// ─────────────────────────────────────────────────────────
// QI ORB
// ─────────────────────────────────────────────────────────
function QiOrb({ realm, active }) {
  const col = REALM_COLORS[realm] || "#8b5cf6";
  const particles = [
    { dx: "20px", delay: "0s",   ml: "10px", mb: "10px" },
    { dx: "-15px",delay: ".6s",  ml: "-10px",mb: "5px"  },
    { dx: "5px",  delay: "1.2s", ml: "15px", mb: "0px"  },
    { dx: "-20px",delay: "1.8s", ml: "-5px", mb: "-5px" },
    { dx: "15px", delay: ".3s",  ml: "-15px",mb: "8px"  },
  ];
  return (
    <div className="orb-wrap">
      <div className="orb" style={{
        background: `radial-gradient(circle at 38% 35%, ${col}cc, ${col}44 55%, ${col}11)`,
        boxShadow: `0 0 40px 10px ${col}44, inset 0 0 30px ${col}22`,
      }} />
      <div className="orb-ring" style={{ borderColor: col + "66" }} />
      <div className="orb-ring" style={{ borderColor: col + "33", animationDelay: ".8s" }} />
      {active && particles.map((p, i) => (
        <div key={i} className="orb-particle" style={{
          background: col,
          "--dx": p.dx,
          animationDelay: p.delay,
          animationDuration: `${2 + i * 0.3}s`,
          marginLeft: p.ml,
          marginBottom: p.mb,
          boxShadow: `0 0 6px 2px ${col}88`,
        }} />
      ))}
      <div style={{
        position: "absolute", inset: 0,
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        gap: 2,
      }}>
        <span style={{ fontSize: 28, lineHeight: 1 }}>{REALM_EMOJI[realm]}</span>
        {active && (
          <span style={{
            fontSize: 9, fontWeight: 700, letterSpacing: 1,
            color: col, textTransform: "uppercase",
            background: "rgba(0,0,0,.5)", borderRadius: 4,
            padding: "1px 6px", marginTop: 4,
          }}>cultivando</span>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// SCREEN: HOME / CULTIVAR
// ─────────────────────────────────────────────────────────
function HomeScreen({ player }) {
  const col = REALM_COLORS[player.realm];
  const cbPct = pct(player.cb, player.cb_threshold);
  const qiPct = pct(player.qi, player.qi_max);
  const hpPct = pct(player.hp, player.hp_max);
  const timer = useTimer(player.meditation_started, player.meditation_active);
  const medTypes = { light: "🧘 Leve", deep: "🔮 Profunda", void: "💜 Vazio", celestial_dao: "🌠 Celestial" };

  return (
    <div className="screen-scroll screen-fade">
      {/* Header */}
      <div style={{ padding: "16px 16px 0" }}>
        {/* Resource bar */}
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <div style={{
            flex: 1, background: "rgba(201,144,58,.12)", border: "1px solid rgba(201,144,58,.25)",
            borderRadius: 10, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6,
          }}>
            <span style={{ fontSize: 14 }}>💎</span>
            <span style={{ fontSize: 12, color: "#c9903a", fontWeight: 700 }}>{fmt(player.spirit_stones)}</span>
            <span style={{ fontSize: 10, color: "var(--muted)", marginLeft: 2 }}>Stones</span>
          </div>
          <div style={{
            flex: 1, background: "rgba(124,58,237,.12)", border: "1px solid rgba(124,58,237,.25)",
            borderRadius: 10, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6,
          }}>
            <span style={{ fontSize: 14 }}>🔮</span>
            <span style={{ fontSize: 12, color: "#a78bfa", fontWeight: 700 }}>{player.spirit_jade}</span>
            <span style={{ fontSize: 10, color: "var(--muted)", marginLeft: 2 }}>Jade</span>
          </div>
          {player.tribulation_ready && (
            <div style={{
              background: "rgba(229,83,75,.15)", border: "1px solid rgba(229,83,75,.4)",
              borderRadius: 10, padding: "6px 10px", display: "flex", alignItems: "center", gap: 4,
            }}>
              <span style={{ fontSize: 14 }}>⚡</span>
              <span style={{ fontSize: 10, color: "#e5534b", fontWeight: 700 }}>TRIB</span>
            </div>
          )}
        </div>

        {/* Realm title */}
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <div style={{
            fontFamily: "Cinzel", fontSize: 11, letterSpacing: 2,
            color: "var(--muted)", textTransform: "uppercase", marginBottom: 4,
          }}>
            {player.sect_name} · {player.sect_rank}
          </div>
          <div style={{
            fontFamily: "Cinzel", fontSize: 20, fontWeight: 700, color: col,
            textShadow: `0 0 20px ${col}88`,
          }}>
            {REALM_NAMES[player.realm]}
          </div>

const SUB_LAYERS_PER_REALM = 9;

// ─────────────────────────────────────────────────────────
// BOTTOM NAV

const TABS = [
  { id: "home",    label: "Cultivar",  icon: "☯️" },
  { id: "combat",  label: "Combate",   icon: "⚔️" },

// ─────────────────────────────────────────────────────────
// DEMO BANNER (shown when not inside Telegram or no API)
// ─────────────────────────────────────────────────────────
function DemoBanner() {
  const [hidden, setHidden] = useState(false);
  if (hidden) return null;
  return (
    <div style={{
      background: "rgba(124,58,237,.15)", borderBottom: "1px solid rgba(124,58,237,.3)",
      padding: "6px 14px", display: "flex", alignItems: "center", justifyContent: "space-between",
      fontSize: 11, color: "#a78bfa", zIndex: 200,
    }}>
      <span>🎮 Modo Demo — dados mock · API não conectada</span>
      <button onClick={() => setHidden(true)} style={{ background: "none", border: "none", color: "#a78bfa", cursor: "pointer", fontSize: 14 }}>×</button>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("home");
  const [player, setPlayer] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isDemo, setIsDemo] = useState(true);

  useEffect(() => {
    // Init Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.("#06080f");
      tg.setBackgroundColor?.("#06080f");
    }

    async function loadPlayer() {
      try {
        if (API_BASE && tg?.initData) {
          const res = await fetch(`${API_BASE}/api/miniapp/player`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ init_data: tg.initData }),
          });
          if (res.ok) {
            const data = await res.json();
            setPlayer(data);
            setIsDemo(false);
            return;
          }
        }
      } catch (e) {
        console.log("API unavailable, using demo mode:", e.message);
      }
      // Fallback to mock
      await new Promise(r => setTimeout(r, 1200)); // splash delay
      setPlayer(MOCK_PLAYER);
      setIsDemo(true);
    }

    loadPlayer().finally(() => setLoading(false));
  }, []);

  if (loading) return <LoadingSplash />;
  if (!player)  return <LoadingSplash />;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
      {isDemo && <DemoBanner />}
      <TopHeader player={player} tab={tab} />
      <div style={{ flex: 1, overflow: "hidden", position: "relative" }}>
        {tab === "home"    && <HomeScreen    player={player} />}
        {tab === "combat"  && <CombatScreen  player={player} />}
        {tab === "world"   && <WorldScreen   player={player} />}
        {tab === "craft"   && <CraftScreen   player={player} />}
        {tab === "profile" && <ProfileScreen player={player} />}
      </div>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
