server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permitir abrir no Telegram WebApp (iframe)
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Opcional: raiz vai para miniapp
    location = / {
        return 302 /miniapp/;
    }

    # Miniapp SPA
    location /miniapp/ {
        try_files $uri $uri/ /miniapp/index.html;
    }
}
