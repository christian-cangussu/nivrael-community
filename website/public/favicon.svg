<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0a1f"/>
      <stop offset="100%" stop-color="#030308"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- Outer Dao ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.7"/>
  <!-- Cross lines (Dao symbol) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="16" x2="48" y2="48" stroke="#FFD700" stroke-width="0.8" opacity="0.3"/>
  <line x1="48" y1="16" x2="16" y2="48" stroke="#FFD700" stroke-width="0.8" opacity="0.3"/>
  <!-- Center orb -->
  <circle cx="32" cy="32" r="5" fill="#FFD700" opacity="0.95"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.7"/>
</svg>
