# Nivrael — community edition · continuous integration
#
# Runs on every pull request and on every push to main (free on public
# repositories). Each job keeps one promise of CONTRIBUTING.md:
#
#   tests    `python scripts/run_tests.py` on Python 3.11, the production
#            container's version — the game suites, the edition suite, the
#            audits, the documentation guard and the publication guard
#   client   the website and the compiled client, built the way the Dockerfile
#            builds them
#   guards   the sabotage battery of the edition: every guard still turns red
#            when the thing it guards is broken
#   dco      every commit of a pull request is signed off
#   compose  `docker compose up` really boots the game, lets a newcomer in, and
#            saves what the player sees at 390x844 and 1440x900
#
# Safety: the trigger is `pull_request` (never `pull_request_target`), the token
# is read-only, no job has a secret, and every action is pinned to a commit — a
# pull request from a fork runs with nothing to steal and nothing to write.
# The publication guard runs WITHOUT the private lists (the player nicknames and
# the reserved lore): they exist only in the official game's private repository.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: The game's Python dependencies
        run: pip install -r requirements.txt
      - name: The website's dependencies (esbuild, which the suites compile the client with)
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: A headless Chrome for the browser checks
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "::error::no Chrome on this runner"; exit 1; fi
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "NV_CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
      - name: Every check of the edition
        run: python scripts/run_tests.py

  client:
    name: client and website build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install the website
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Build the website
        working-directory: website
        run: npm run build
      - name: Compile the client
        run: node scripts/build_miniapp.mjs miniapp
      - name: The bundle exists
        run: test -s miniapp/dist/bundle.js

  guards:
    name: the guards still bite (sabotage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: The game's Python dependencies
        run: pip install -r requirements.txt
      - name: Break each guarded thing on purpose, and see the right guard turn red
        run: python scripts/_sabota_a_copia_publica.py

  dco:
    name: commits signed off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Every commit carries a Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/_verifica_dco.py "$BASE" "$HEAD"

  compose:
    name: docker compose up (the game boots)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: A headless Chrome for the screenshots
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "::error::no Chrome on this runner"; exit 1; fi
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "NV_CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
      - name: Build the image and start PostgreSQL and the game
        run: docker compose up --build --detach
      - name: Walk in like a player, and look at 390x844 and 1440x900
        run: python scripts/_fumo_da_edicao.py --url http://127.0.0.1:8080 --wait 900 --bundle --shots "$RUNNER_TEMP/shots"
      - name: The game's log
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
          tail -n 150 "$RUNNER_TEMP/compose.log"
      - name: Keep the screenshots and the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-boot
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
