<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080f;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.realm-card{position:relative;width:108px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);flex-shrink:0}
.realm-card img{width:100%;height:90px;object-fit:cover;display:block;filter:brightness(.85)}
.realm-card .overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(0deg,rgba(6,8,15,.92) 60%,transparent)}
.realm-card .num{font-size:9px;color:#3d5a9e;letter-spacing:.5px;text-transform:uppercase}
.realm-card .name{font-family:'Cinzel',serif;font-size:9px;font-weight:600;letter-spacing:.3px;line-height:1.3;margin-top:1px}
.realm-card .glyph{position:absolute;top:5px;right:7px;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;opacity:.6}
</style></head>
<body>
  <div class="realm-card"><img src="../assets/realm-mortal.webp" alt="Mortal"><div class="glyph" style="color:#9ca3af">凡</div><div class="overlay"><div class="num">Realm 0</div><div class="name" style="color:#9ca3af">Mortal</div></div></div>
  <div class="realm-card"><img src="../assets/realm-qi.webp" alt="Qi"><div class="glyph" style="color:#60a5fa">氣</div><div class="overlay"><div class="num">Realm 1</div><div class="name" style="color:#60a5fa">Qi Condensation</div></div></div>
  <div class="realm-card"><img src="../assets/realm-foundation.webp" alt="Foundation"><div class="glyph" style="color:#fbbf24">築</div><div class="overlay"><div class="num">Realm 2</div><div class="name" style="color:#fbbf24">Foundation</div></div></div>
  <div class="realm-card"><img src="../assets/realm-core.webp" alt="Core"><div class="glyph" style="color:#a855f7">核</div><div class="overlay"><div class="num">Realm 3</div><div class="name" style="color:#a855f7">Core Formation</div></div></div>
  <div class="realm-card"><img src="../assets/realm-nascent-soul.webp" alt="Nascent Soul"><div class="glyph" style="color:#2dd4bf">嬰</div><div class="overlay"><div class="num">Realm 4</div><div class="name" style="color:#2dd4bf">Nascent Soul</div></div></div>
  <div class="realm-card"><img src="../assets/realm-soul-transformation.webp" alt="Soul Transform"><div class="glyph" style="color:#3b82f6">化</div><div class="overlay"><div class="num">Realm 5</div><div class="name" style="color:#3b82f6">Soul Transform.</div></div></div>
  <div class="realm-card"><img src="../assets/realm-void-refinement.webp" alt="Void"><div class="glyph" style="color:#8b5cf6">虛</div><div class="overlay"><div class="num">Realm 6</div><div class="name" style="color:#8b5cf6">Void Refinement</div></div></div>
  <div class="realm-card"><img src="../assets/realm-body-integration.webp" alt="Body"><div class="glyph" style="color:#f59e0b">合</div><div class="overlay"><div class="num">Realm 7</div><div class="name" style="color:#f59e0b">Body Integration</div></div></div>
  <div class="realm-card"><img src="../assets/realm-mahayana.webp" alt="Mahayana"><div class="glyph" style="color:#38bdf8">大</div><div class="overlay"><div class="num">Realm 8</div><div class="name" style="color:#38bdf8">Mahayana</div></div></div>
  <div class="realm-card"><img src="../assets/realm-tribulation.webp" alt="Tribulation"><div class="glyph" style="color:#eab308">渡</div><div class="overlay"><div class="num">Realm 9</div><div class="name" style="color:#eab308">Tribulation</div></div></div>
  <div class="realm-card" style="border-color:rgba(244,114,182,.3)"><img src="../assets/realm-true-immortal.webp" alt="True Immortal"><div class="glyph" style="color:#f472b6">仙</div><div class="overlay" style="background:linear-gradient(0deg,rgba(6,8,15,.95) 60%,transparent)"><div class="num">Realm 10</div><div class="name" style="color:#f472b6">True Immortal</div></div></div>
</body></html>
