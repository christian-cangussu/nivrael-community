<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080f;font-family:'Noto Sans',sans-serif;padding:0;color:#e2eaff;display:flex;flex-direction:column;gap:16px;padding:16px}

.topbar{padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(60,90,180,.18);background:linear-gradient(180deg,rgba(13,20,34,.85),rgba(13,20,34,.6) 80%,transparent)}
.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dao-name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;background:linear-gradient(90deg,#f5c97a,#c9903a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.dao-title{font-family:'Noto Serif SC',serif;font-size:10px;color:#6e89bf;margin-top:1px}
.realm-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(0,0,0,.35);border:1px solid #2dd4bf;color:#2dd4bf;white-space:nowrap}
.currencies{display:flex;gap:10px;font-size:12px;flex-wrap:wrap}
.currency{display:inline-flex;align-items:center;gap:4px;color:#6e89bf}
.currency b{color:#e2eaff;font-weight:600}

.tabbar{display:flex;justify-content:space-around;padding:8px 4px 10px;background:rgba(13,20,34,.95);border-top:1px solid #1e3060;border-radius:14px}
.tab{flex:0 0 auto;min-width:52px;background:none;border:none;color:#3d5a9e;font-size:9px;font-weight:500;padding:5px 3px;border-radius:8px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;letter-spacing:.3px}
.tab .ico{font-size:19px;line-height:1}
.tab.active{color:#f5c97a}
.tab.active .ico{filter:drop-shadow(0 0 6px rgba(245,201,122,.5))}
</style></head>
<body>
  <!-- Player header -->
  <div style="border-radius:14px;overflow:hidden;border:1px solid rgba(30,48,96,.5)">
    <div class="topbar">
      <div class="topbar-row">
        <div>
          <div class="dao-name">劍天明 · Jian Tianming</div>
          <div class="dao-title">Arcanista dos Picos Nevados</div>
        </div>
        <span class="realm-pill">嬰 5</span>
      </div>
      <div class="currencies">
        <span class="currency">💎 <b>1,240</b></span>
        <span class="currency">🪨 <b>340K</b></span>
        <span class="currency">✨ <b>88</b></span>
        <span class="currency" style="margin-left:auto;color:#f5c97a">✦ Raiz Celestial</span>
      </div>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tabbar">
    <button class="tab active"><div class="ico">☯️</div><div>Cultivo</div></button>
    <button class="tab"><div class="ico">🏯</div><div>Seita</div></button>
    <button class="tab"><div class="ico">🐉</div><div>Chefe</div></button>
    <button class="tab"><div class="ico">🏆</div><div>Ranking</div></button>
    <button class="tab"><div class="ico">🎒</div><div>Anel</div></button>
    <button class="tab"><div class="ico">🎯</div><div>Missões</div></button>
    <button class="tab"><div class="ico">📜</div><div>Notícias</div></button>
  </div>
</body></html>
