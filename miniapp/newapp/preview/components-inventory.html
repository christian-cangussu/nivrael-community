<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080f;font-family:'Noto Sans',sans-serif;padding:16px;color:#e2eaff;display:flex;flex-direction:column;gap:10px}
.inv-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.inv-cell{aspect-ratio:1;background:linear-gradient(180deg,rgba(40,55,90,.7),rgba(20,30,55,.9));border:1px solid #1e3060;border-radius:8px;display:grid;place-items:center;position:relative;font-size:18px}
.inv-cell.equipped{border-color:#c9903a;box-shadow:inset 0 0 8px rgba(201,144,58,.3)}
.inv-cell .qty{position:absolute;right:3px;bottom:1px;font-size:9px;font-weight:700;color:#f5c97a;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.inv-cell .grade{position:absolute;left:3px;top:1px;font-size:8px;font-weight:700;color:#6e89bf}
/* Grade colors */
.g0{color:#9ca3af}.g1{color:#60a5fa}.g2{color:#3ecf7e}.g3{color:#a855f7}.g4{color:#f59e0b}.g5{color:#f472b6}.g6{color:#38bdf8}.g7{color:#f5c97a}.g8{color:#f472b6}
.card-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6e89bf;margin-bottom:8px;display:flex;justify-content:space-between}
.card-title b{color:#f5c97a}
</style></head>
<body>
  <div class="card-title"><span>Equipado</span><b>3/6</b></div>
  <div class="inv-grid">
    <div class="inv-cell equipped"><span class="grade g6">G6</span>🗡️</div>
    <div class="inv-cell equipped"><span class="grade g5">G5</span>🛡️</div>
    <div class="inv-cell equipped"><span class="grade g4">G4</span>💍</div>
    <div class="inv-cell" style="opacity:.3"></div>
    <div class="inv-cell" style="opacity:.3"></div>
    <div class="inv-cell" style="opacity:.3"></div>
  </div>

  <div class="card-title" style="margin-top:8px"><span>Anel Espacial</span><b>12</b></div>
  <div class="inv-grid">
    <div class="inv-cell"><span class="grade g3">G3</span>🗡️</div>
    <div class="inv-cell"><span class="grade g2">G2</span>🛡️</div>
    <div class="inv-cell"><span class="grade g1">G1</span>💍</div>
    <div class="inv-cell"><span class="grade g4">G4</span>🗡️</div>
    <div class="inv-cell"><span class="grade g2">G2</span>🪄</div>
    <div class="inv-cell"><span class="grade g0">G0</span>🛡️</div>
  </div>

  <div class="card-title" style="margin-top:8px"><span>Itens</span><b>9</b></div>
  <div class="inv-grid">
    <div class="inv-cell">💊<span class="qty">12</span></div>
    <div class="inv-cell">🌿<span class="qty">8</span></div>
    <div class="inv-cell">⚒️<span class="qty">3</span></div>
    <div class="inv-cell">💊<span class="qty">1</span></div>
    <div class="inv-cell">🌿<span class="qty">24</span></div>
    <div class="inv-cell">📦<span class="qty">5</span></div>
  </div>
</body></html>
