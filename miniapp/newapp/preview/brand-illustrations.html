<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080f;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;color:#e2eaff}
.art-card{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(60,90,180,.25);flex-shrink:0}
.art-card img{display:block;object-fit:cover}
.art-card .label{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(0deg,rgba(6,8,15,.9),transparent);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.5px;color:#6e89bf;text-transform:uppercase}
</style></head>
<body>
  <div class="art-card" style="width:280px">
    <img src="../assets/hero-bg.webp" style="width:280px;height:160px" alt="Hero BG">
    <div class="label">Hero Background</div>
  </div>
  <div class="art-card" style="width:280px">
    <img src="../assets/clouds-divider.webp" style="width:280px;height:80px" alt="Clouds">
    <div class="label">Clouds Divider</div>
  </div>
  <div class="art-card" style="width:180px">
    <img src="../assets/alchemy-art.webp" style="width:180px;height:160px" alt="Alchemy">
    <div class="label">Alchemy Art</div>
  </div>
</body></html>
