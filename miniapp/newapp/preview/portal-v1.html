const details={
sect:{title:'Uma técnica é uma herança.',eyebrow:'A SEITA',art:'door-mundo-sect.webp',text:'Pertencer a uma seita é construir uma relação com uma instituição viva: aprender, contribuir, receber missões e conquistar acesso à sua biblioteca. A porta não acaba na inscrição.',a:'Biblioteca',b:'Conhecimento e contribuição',cta:'Ver meu caminho',go:'personal'},
plaza:{title:'O mundo tem outras vidas.',eyebrow:'A PRAÇA',art:'door-mundo-plaza.webp',text:'Cultivadores, encontros e histórias se cruzam aqui. A praça liga o que acontece na região às pessoas que você pode encontrar. Cada acontecimento precisa levar de volta a um lugar.',a:'Encontros',b:'Presença e histórias',cta:'Abrir o pergaminho',go:'scroll'},
dungeons:{title:'Nem tudo foi esquecido.',eyebrow:'AS MASMORRAS',art:'door-mundo-dungeons.webp',text:'Os portais guardam expedições ao que o mundo deixou para trás. Preparação, risco e recompensa precisam ser compreensíveis antes de atravessar.',a:'Antes de entrar',b:'Conhecer o risco',cta:'Preparar o confronto',go:'combat'},
caravan:{title:'O longe chega até você.',eyebrow:'A CARAVANA',art:'door-mundo-caravan.webp',text:'A caravana faz circular materiais e oportunidades. Na experiência final, sua presença, mercadoria e próximo movimento serão os do mundo ativo — nunca uma contagem inventada.',a:'Presença',b:'Depende do mundo e da região',cta:'Voltar ao continente',go:'region'},
hall:{title:'Um lugar para permanecer.',eyebrow:'O SALÃO',art:'door-caverna-salao.webp',text:'A caverna é abrigo e investimento: um lugar que você estabelece e cuida. Quando ainda não existe, a porta continua acessível e explica como chegar lá.',a:'O espaço',b:'Cultivo e formações',cta:'Sentar para cultivar',go:'personal'},
forge:{title:'O fogo revela a matéria.',eyebrow:'A FORJA',art:'door-caverna-forja.webp',text:'Forjar e refinar exigem materiais, receitas e escolhas. O objeto é o centro: sua imagem, suas propriedades e o que a próxima ação realmente muda.',a:'Antes de forjar',b:'Materiais, custo e resultado',cta:'Examinar o anel',next:'ring'},
ring:{title:'Uma vida cabe no anel.',eyebrow:'O ANEL ESPACIAL',art:'door-caverna-anel.webp',text:'Artefatos, pílulas, manuais e materiais carregam o caminho percorrido. A peça deve ser reconhecível aqui, no mercado, na forja e na recompensa; o verso explica seu uso e suas restrições.',a:'O que importa',b:'Origem, efeito e próximo uso',cta:'Ver a forja',next:'forge'},
beasts:{title:'Você não caminha sozinho.',eyebrow:'O ESTÁBULO',art:'door-caverna-estabulo.webp',text:'Capturar, cuidar e enviar bestas em expedições são relações diferentes. O estábulo continua sendo um lugar mesmo antes de receber sua primeira companheira.',a:'Companhia',b:'Vínculo e expedições',cta:'Explorar a região',go:'explore'},
market:{title:'Toda peça tem uma história.',eyebrow:'O MERCADO',art:'door-caverna-mercado.webp',text:'O mercado fica além da caverna: esta porta é uma passagem para a cidade. Trocas e ofertas aproximam os caminhos de diferentes jogadores.',a:'O encontro',b:'Objetos e outros cultivadores',cta:'Ir para a praça',next:'plaza'},
body:{title:'O corpo é uma obra.',eyebrow:'REFINAMENTO',art:'cultivator-back.webp',text:'O cultivo do corpo precisa tornar legível o que você está construindo, o custo de cada avanço e seu efeito real. A ambição do cânone e a mecânica já implementada permanecem distinguidas.',a:'Preparação',b:'Qi, materiais e requisito',cta:'Voltar ao cultivo',go:'personal'},

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=(file,cls='',alt='')=>'<img class="'+cls+'" src="'+ASSETS+file+'" alt="'+esc(alt)+'" draggable="false">';
const bg=file=>'<div class="scene-bg">'+img(file)+'</div>';
const btn=(text,go,cls='primary')=>'<button class="'+cls+'" data-go="'+go+'">'+text+'</button>';
function activeHub(){return ['region','explore'].includes(state.view)?'atlas':state.view;}
function navigation(){
document.getElementById('shell').dataset.still=String(state.still);
const active=activeHub();const html=hubs.map(h=>'<button data-go="'+h[0]+'"'+(active===h[0]?' aria-current="page"':'')+'><span class="glyph" aria-hidden="true">'+h[1]+'</span> '+h[2]+'</button>').join('');
document.getElementById('topnav').innerHTML=state.view==='arrival'?'<button data-go="atlas">Conhecer o mundo</button><button data-action="legend">A lenda</button>':html;
document.getElementById('bottomnav').innerHTML=html;
document.getElementById('bottomnav').hidden=state.view==='arrival';
document.getElementById('shell').classList.toggle('in-world',state.view!=='arrival');
document.getElementById('identity').innerHTML=state.signed?esc(state.name)+' ↗':'Entrar ↗';
const labels={arrival:'O limiar',atlas:'Mundo Mortal',region:regions[state.region].name,personal:'O cultivador',cave:'A caverna',combat:'O confronto',scroll:'O pergaminho',explore:'Além do caminho'};
document.getElementById('crumb').innerHTML='<button data-go="arrival">Nivrael</button><span>/</span>'+(state.view==='region'||state.view==='explore'?'<button data-go="atlas">Mundo</button><span>/</span>':'')+esc(labels[state.view]);
document.getElementById('motion').textContent=state.still?'Ativar atmosfera':'Pausar atmosfera';
document.getElementById('motion').setAttribute('aria-pressed',String(state.still));
}
function viewHTML(){
const r=regions[state.region];
if(state.view==='arrival')return '<section class="scene arrival">'+bg('isle-linghe-scene.webp')+'<div class="intro"><p class="eyebrow">凡界 &nbsp; O MUNDO MORTAL</p><h1>Entre o pó<br>e o <em>Céu.</em></h1><p class="copy">Você não escolhe onde nasce.<br>O que faz depois pode mudar uma era.</p>'+btn('Atravessar o mundo','atlas')+'<button class="subaction" data-action="login">Meu caminho já começou &nbsp; ↗</button></div><div class="vertical-poem" aria-hidden="true">一山 · 万途 · 一座</div><aside class="horizon-note"><span class="line"></span><span class="mini-label">UMA MONTANHA. MUITOS CAMINHOS.</span><p>O mundo continua.<br>Mesmo quando você fecha os olhos.</p></aside></section>';
if(state.view==='atlas')return '<section class="scene atlas">'+bg('hub-mundo-noite-scene.webp')+'<div class="context"><p class="eyebrow">州 &nbsp; CINCO CONTINENTES · UM CÉU</p><h1>O mundo<br>é <em>maior.</em></h1><p class="copy">Cinco terras nasceram da mesma ferida.<br>Toque uma delas. Conheça o que vive além do horizonte.</p><div class="scene-tools"><button data-action="legend">A Grande Calamidade ↗</button><button data-go="scroll">A crônica ↗</button><button data-go="combat">Sob o mesmo Céu ↗</button></div></div><div class="atlas-board" role="group" aria-label="Mapa dos cinco continentes">'+Object.keys(regions).map(k=>'<button class="island '+k+'" data-region="'+k+'" aria-label="Conhecer '+regions[k].name+'">'+img('land-mundo-'+k+'.webp')+'<span class="island-name">'+regions[k].name+'<small>'+regions[k].label+'</small></span></button>').join('')+'</div></section>';
if(state.view==='region')return '<section class="scene region">'+bg('isle-'+state.region+'-scene.webp')+'<div class="context"><p class="eyebrow">'+r.glyph+' &nbsp; '+r.label+'</p><h1>'+r.name+'</h1><p class="copy">'+r.body+'</p><p class="travel-note">Você está conhecendo este lugar.<br>A sua história começa quando decidir ficar.</p><button class="subaction" data-go="atlas">← Ver os cinco continentes</button></div><div class="place-board" role="group" aria-label="Lugares de '+r.name+'">'+sites.map(s=>'<button class="door" '+(s[0]==='explore'?'data-go="explore"':s[0]==='chronicle'?'data-go="scroll"':'data-detail="'+s[0]+'"')+' aria-label="'+s[2]+'">'+img('door-mundo-'+s[1]+'.webp')+'<span class="door-name">'+s[2]+'</span><small>'+s[3]+'</small></button>').join('')+'</div></section>';
if(state.view==='personal')return '<section class="scene personal '+(state.meditating?'meditating':'')+'">'+bg('realm-mortal-place.webp')+'<div class="context"><p class="eyebrow">道 &nbsp; MORTAL · O INÍCIO DO CAMINHO</p><h1>'+esc(state.name==='Sem Nome'?'Uma vida.':state.name)+ '<br><em>Um caminho.</em></h1><p class="copy">'+(state.meditating?'O corpo repousa. O cultivo continua.<br>Nem toda transformação precisa fazer ruído.':'O Céu não promete grandeza.<br>Há um lugar para sentar. O primeiro passo é seu.')+'</p><div class="personal-state"><div class="readout"><span>ESTADO</span><b>'+(state.meditating?'Em meditação leve':'Em contemplação')+'</b></div><div class="thread"></div><div class="readout"><span>O TEMPO DO CULTIVO</span><b>'+(state.meditating?'A espera faz parte do caminho':'Um sopro de cada vez')+'</b></div><button class="primary '+(state.meditating?'dark':'')+'" data-action="meditate">'+(state.meditating?'Levantar-se':'Sentar para meditar')+'</button><div class="personal-links"><button data-detail="body">O corpo ↗</button><button data-detail="technique">As técnicas ↗</button><button data-go="cave">O abrigo ↗</button></div></div></div>'+img('cultivator-back.webp','cultivator')+'<p class="sitting-caption">O silêncio também é uma escolha.</p></section>';
if(state.view==='cave')return '<section class="scene cave">'+bg('hub-caverna-scene.webp')+'<div class="context"><p class="eyebrow">洞府 &nbsp; O SEU ABRIGO</p><h1>O mundo lá fora.<br><em>Você, aqui.</em></h1><p class="copy">A matéria espera pelo fogo. O anel guarda o que veio do caminho. A caverna reúne os gestos de uma vida.</p><button class="subaction" data-go="personal">← Voltar ao cultivo</button></div><div class="place-board" role="group" aria-label="Lugares da caverna">'+caveSites.map(s=>'<button class="door" data-detail="'+s[0]+'">'+img('door-caverna-'+s[1]+'.webp')+'<span class="door-name">'+s[2]+'</span><small>'+s[3]+'</small></button>').join('')+'</div></section>';
if(state.view==='scroll')return '<section class="scene scroll-scene"><div class="context"><p class="eyebrow">卷 &nbsp; O SEU PERGAMINHO</p><h1>O que fica<br>de <em>uma vida.</em></h1><p class="copy">O mundo deixa marcas. Você também.<br>Encontros, compromissos e notícias pertencem à mesma história.</p><button class="subaction" data-go="region">← Voltar a '+r.name+'</button></div><article class="journal"><span class="eyebrow">REGISTROS DO CAMINHO</span><h2>Um dia ainda<br>por escrever.</h2><div class="entry"><span class="date">O LUGAR</span><p>Há caminhos abertos em '+r.name+'.<br>O horizonte não é o fim do mapa.</p><button data-go="region">Ver este lugar &nbsp; →</button></div><div class="entry"><span class="date">O COMPROMISSO</span><p>'+(state.meditating?'Você se sentou para cultivar.<br>Nem tudo que cresce pode ser visto.':'Antes de buscar os Céus,<br>encontre o seu primeiro silêncio.')+'</p><button data-go="personal">Voltar ao cultivo &nbsp; →</button></div><p class="unwritten">O restante ainda pertence a você.</p></article></section>';
if(state.view==='combat')return '<section class="scene combat-scene">'+bg('isle-moyu-scene.webp')+'<div class="context"><p class="eyebrow">武 &nbsp; A INTENÇÃO ANTES DO GOLPE</p><h1>Antes da força,<br><em>a escolha.</em></h1><p class="copy">O adversário ocupa o horizonte.<br>A sua técnica, a postura e o risco ocupam a sua atenção.</p><div class="combat-controls"><span class="mini-label">ESTUDO VISUAL DE PREPARAÇÃO</span><div class="stances">'+['Ofensiva','Equilíbrio','Defensiva'].map(s=>'<button class="stance" data-stance="'+s+'" aria-pressed="'+(state.stance===s)+'">'+s+'</button>').join('')+'</div><p class="combat-note" id="stance-note">'+stanceCopy()+'</p><button class="primary dark" data-detail="technique">Examinar minhas técnicas</button></div></div>'+img('boss-shadow-wolf-alpha.webp','opponent')+'</section>';
return '<section class="scene explore-scene">'+bg('isle-'+state.region+'-scene.webp')+'<div class="context"><p class="eyebrow">行 &nbsp; '+r.name+' · EXPLORAÇÃO</p><h1>'+(state.explore?'O horizonte<br><em>se abre.</em>':'Além do<br><em>caminho.</em>')+'</h1><p class="copy">'+(state.explore?'Um lugar visto de longe agora está diante de você. A paisagem continua; a decisão seguinte ainda é sua.':'As vozes da praça ficaram para trás. Entre a névoa e a pedra, há um caminho que você ainda não percorreu.')+'</p><div class="choices"><button class="primary" data-action="explore">'+(state.explore?'Encontrar a praça':'Seguir pela trilha')+'</button>'+btn('Voltar em segurança','region','primary dark')+'</div><p class="study-note copy">Encontro ilustrativo da prévia; sem risco ou recompensa reais.</p></div></section>';
}
function stanceCopy(){return {Ofensiva:'A intenção avança. Esta prévia mostra a leitura da postura, sem calcular um combate.',Equilíbrio:'Observe antes de agir. A forma dá espaço à preparação e às consequências.',Defensiva:'A intenção resguarda. O risco precisa estar claro antes de confirmar qualquer confronto.'}[state.stance];}
function render(focus=true){
navigation();document.getElementById('main').innerHTML=viewHTML();
const scene=document.querySelector('.scene');if(!state.still)scene.classList.add('entering');
document.querySelectorAll('*').forEach(el=>{if(el.classList.contains('cultivator'))el.style.animationPlayState=state.still?'paused':'running';});
if(focus){window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
}
function go(view,push=true){if(!['arrival','atlas','region','personal','cave','combat','scroll','explore'].includes(view))return;state.view=view;if(push)history.pushState({view,region:state.region},'', '#'+view+(view==='region'?'-'+state.region:''));render();}
let dialogOpener=null;
function modal(content){
const d=document.getElementById('dialog');if(!d.open)dialogOpener=document.activeElement;
document.getElementById('dialog-body').innerHTML='<button class="dialog-close" data-action="close" aria-label="Fechar">×</button>'+content;
if(!d.open)d.showModal();
d.querySelector('button').focus();
}
function closeModal(){document.getElementById('dialog').close();if(dialogOpener&&dialogOpener.isConnected)dialogOpener.focus();}
function detail(key){const d=details[key];if(!d)return;modal('<p class="eyebrow">'+d.eyebrow+'</p>'+img(d.art,'dialog-art')+'<h2 id="dialog-title">'+d.title+'</h2><p>'+d.text+'</p><dl class="detail-dl"><dt>'+d.a+'</dt><dd>'+d.b+'</dd></dl><button class="primary" '+(d.next?'data-detail="'+d.next+'"':'data-modal-go="'+d.go+'"')+'>'+d.cta+'</button>');}
function login(){modal('<p class="eyebrow">身份 &nbsp; O SEU LUGAR NESTE MUNDO</p><h2 id="dialog-title">O caminho<br>reconhece você.</h2><p>Quem já cultiva pode retomar sua história. Quem acaba de chegar encontra o primeiro passo sem deixar este mundo.</p><div class="providers"><button data-action="demo-name">Google</button><button data-action="demo-name">Apple</button><button data-action="demo-name">E-mail</button><button data-action="telegram">Telegram</button></div><p class="study-note">Nesta prévia, os botões apenas demonstram o percurso. Nenhuma conta é criada e nenhuma credencial é solicitada.</p>');}
function nameForm(){modal('<p class="eyebrow">道 &nbsp; UM NOME PARA O CAMINHO</p><h2 id="dialog-title">Como será<br>lembrado?</h2><form id="name-form"><label for="dao-name">Nome de cultivo da demonstração</label><input id="dao-name" name="dao-name" minlength="3" maxlength="16" autocomplete="off" placeholder="Seu nome de cultivo" required><p class="error" id="name-error" hidden>Use de 3 a 16 letras ou números, começando com uma letra.</p><button class="primary" type="submit">Começar a demonstração</button></form><button class="subaction" data-action="link">Já tenho um personagem em outra plataforma ↗</button><p class="study-note">Este nome vive apenas nesta página. Não cria nem modifica um personagem real.</p>');setTimeout(()=>document.getElementById('dao-name')?.focus(),0);}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,4500);}
document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.go){go(b.dataset.go);return;}
if(b.dataset.region){state.region=b.dataset.region;go('region');return;}
if(b.dataset.detail){detail(b.dataset.detail);return;}
if(b.dataset.modalGo){closeModal();go(b.dataset.modalGo);return;}
if(b.dataset.stance){state.stance=b.dataset.stance;document.querySelectorAll('.stance').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.stance===state.stance)));document.getElementById('stance-note').textContent=stanceCopy();return;}
if(b.id==='motion'){state.still=!state.still;render(false);return;}
const action=b.dataset.action;
if(action==='close')closeModal();
if(action==='login')login();
if(action==='demo-name')nameForm();
if(action==='telegram'){state.signed=true;state.name='Cultivador';closeModal();go('personal');toast('Entrada pelo Telegram demonstrada: direto ao seu cultivador.');}
if(action==='meditate'){state.meditating=!state.meditating;render(false);}
if(action==='explore'){if(state.explore){detail('plaza');}else{state.explore=1;render();}}
if(action==='link')modal('<p class="eyebrow">UM CULTIVADOR · DUAS PLATAFORMAS</p><h2 id="dialog-title">A sua história<br>vem com você.</h2><p>No jogo, o vínculo acontece por um código antes de criar outro personagem. Aqui, você pode apenas visualizar o retorno ao cultivador.</p><button class="primary" data-action="telegram">Visualizar meu retorno</button><p class="study-note">Demonstração de percurso. Não pede nem resgata códigos reais.</p>');
if(action==='legend')modal('<p class="eyebrow">A MEMÓRIA DO MUNDO</p><h2 id="dialog-title">Uma terra partida.<br>Um Céu inteiro.</h2><p>Antes dos cinco continentes havia Pángǔ. A tentativa de reunir as Nove Leis rompeu o mundo. O que restou tornou-se o chão de quem nasce agora.</p><p>Há muitos caminhos para o cume.</p><button class="primary" data-modal-go="atlas">Ver o que permaneceu</button>');
if(action==='about')modal('<p class="eyebrow">ASTRA · OLHO DE NIVRAEL</p><h2 id="dialog-title">Um mundo para<br>você julgar.</h2><p>Esta é uma proposta interativa de direção visual, feita com a arte do próprio Nivrael. Explore os cinco continentes, entre nos lugares, conheça a caverna, o cultivo, o confronto e o pergaminho.</p><p>Os estados são demonstrativos. Não há jogadores online, contas, pagamentos, combate calculado ou ligação à base de dados nesta prévia.</p><p>O mesmo arquivo adapta-se ao celular e ao PC. O jogo atual permanece intacto.</p><button class="primary" data-action="telegram">Ver a entrada pelo Telegram</button>');
});
document.addEventListener('submit',e=>{if(e.target.id!=='name-form')return;e.preventDefault();const name=document.getElementById('dao-name').value.trim();if(!/^[a-zA-Z][a-zA-Z0-9]{2,15}$/.test(name)){document.getElementById('name-error').hidden=false;return;}state.name=name;state.signed=true;closeModal();go('personal');});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeModal();});
document.getElementById('dialog').addEventListener('close',()=>{if(dialogOpener&&dialogOpener.isConnected)dialogOpener.focus();});
window.addEventListener('popstate',e=>{if(document.getElementById('dialog').open)closeModal();if(e.state){state.region=e.state.region||state.region;go(e.state.view,false);}else go('arrival',false);});
history.replaceState({view:'arrival',region:state.region},'','#arrival');
render(false);
window.NivraelPreview={state,go,regions,sites,caveSites,details};
</script>
</body>
</html>
