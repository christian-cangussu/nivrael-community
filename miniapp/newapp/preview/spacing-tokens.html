<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06080f;font-family:'Noto Sans',sans-serif;padding:20px 24px;color:#e2eaff}
.section{margin-bottom:18px}
.label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#3d5a9e;margin-bottom:8px}
/* Radii */
.radii{display:flex;gap:10px;align-items:flex-end}
.rbox{display:flex;flex-direction:column;align-items:center;gap:5px}
.rbox .sq{background:rgba(30,48,96,.8);border:1px solid #253f7a}
.rbox .meta{font-size:9px;color:#3d5a9e;font-family:monospace;text-align:center}
/* Spacing */
.spacers{display:flex;gap:8px;align-items:center}
.sp{background:rgba(201,144,58,.25);border:1px solid rgba(201,144,58,.4);height:24px;border-radius:4px}
.sp-meta{font-size:9px;color:#6e89bf;font-family:monospace;margin-top:4px;text-align:center;min-width:28px}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
/* Bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar{height:7px;border-radius:6px;overflow:hidden;border:1px solid rgba(60,90,180,.18);background:rgba(255,255,255,.05);flex:1}
.bar-inner{height:100%;border-radius:6px}
.bar-meta{font-size:10px;color:#3d5a9e;width:70px;text-align:right;font-family:monospace}
/* Elevation */
.elevs{display:flex;gap:10px}
.elev{width:70px;height:50px;border-radius:10px;display:grid;place-items:center;font-size:9px;color:#6e89bf;text-align:center;font-family:monospace;line-height:1.3}
</style></head>
<body>

<div class="section">
  <div class="label">Border Radius</div>
  <div class="radii">
    <div class="rbox"><div class="sq" style="width:24px;height:24px;border-radius:4px"></div><div class="meta">bar<br>6px</div></div>
    <div class="rbox"><div class="sq" style="width:32px;height:32px;border-radius:8px"></div><div class="meta">cell<br>8px</div></div>
    <div class="rbox"><div class="sq" style="width:36px;height:36px;border-radius:10px"></div><div class="meta">inner<br>10px</div></div>
    <div class="rbox"><div class="sq" style="width:44px;height:44px;border-radius:14px"></div><div class="meta">card<br>14px</div></div>
    <div class="rbox"><div class="sq" style="width:32px;height:32px;border-radius:999px"></div><div class="meta">pill<br>999px</div></div>
  </div>
</div>

<div class="section">
  <div class="label">Spacing Scale</div>
  <div class="spacers">
    <div class="sp-wrap"><div class="sp" style="width:4px"></div><div class="sp-meta">4</div></div>
    <div class="sp-wrap"><div class="sp" style="width:8px"></div><div class="sp-meta">8</div></div>
    <div class="sp-wrap"><div class="sp" style="width:12px"></div><div class="sp-meta">12</div></div>
    <div class="sp-wrap"><div class="sp" style="width:14px"></div><div class="sp-meta">14</div></div>
    <div class="sp-wrap"><div class="sp" style="width:16px"></div><div class="sp-meta">16</div></div>
    <div class="sp-wrap"><div class="sp" style="width:20px"></div><div class="sp-meta">20</div></div>
    <div class="sp-wrap"><div class="sp" style="width:24px"></div><div class="sp-meta">24</div></div>
    <div class="sp-wrap"><div class="sp" style="width:32px"></div><div class="sp-meta">32</div></div>
  </div>
</div>

<div class="section">
  <div class="label">Progress Bars</div>
  <div class="bars">
    <div class="bar-row"><div class="bar"><div class="bar-inner" style="width:72%;background:linear-gradient(90deg,#c9903a,#f5c97a)"></div></div><div class="bar-meta">cultivation</div></div>
    <div class="bar-row"><div class="bar"><div class="bar-inner" style="width:55%;background:linear-gradient(90deg,#4cc4ff,#7be3ff)"></div></div><div class="bar-meta">qi</div></div>
    <div class="bar-row"><div class="bar"><div class="bar-inner" style="width:38%;background:linear-gradient(90deg,#ff6b6b,#ffa07a)"></div></div><div class="bar-meta">hp / boss</div></div>
    <div class="bar-row"><div class="bar"><div class="bar-inner" style="width:90%;background:linear-gradient(90deg,#c9903a,#f5c97a);background-size:200% 100%;animation:shimmer 4s linear infinite"></div></div><div class="bar-meta">shimmer</div></div>
  </div>
</div>

<div class="section">
  <div class="label">Surface Elevation</div>
  <div class="elevs">
    <div class="elev" style="background:#06080f;border:1px solid #1e3060">bg<br>#06080f</div>
    <div class="elev" style="background:#0d1422;border:1px solid #1e3060">card<br>#0d1422</div>
    <div class="elev" style="background:#111d35;border:1px solid #253f7a">panel<br>#111d35</div>
    <div class="elev" style="background:linear-gradient(180deg,rgba(17,29,53,.85),rgba(13,20,34,.85));border:1px solid #1e3060">card<br>gradient</div>
  </div>
</div>

<style>@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}</style>
</body></html>
