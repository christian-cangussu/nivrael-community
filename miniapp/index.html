<!--

  2. Zero `translate="no"` no cliente inteiro. Ao aceitar, o tradutor reescreve

  ⚠️ Porque na RAIZ e nao nos nomes um a um: sao **73 sitios** so' com

  ⚠️ E nao tira traducao nenhuma ao jogador: o jogo TEM os tres idiomas
  completos (3963 chaves × 3) e escolhe-os pelo `player.language`. Uma traducao

  <!-- ⚠️ O @babel/standalone (3.137.752 bytes) DEIXOU de ser carregado aqui
       (FORMA, 2026-09-04). Enquanto esta linha existiu, TODO jogador
       descarregava um compilador e compilava 1,79 MB de JSX no telemóvel antes
       de ver um pixel — 1026 ms medidos num desktop de 16 cores, 4-6× isso num
       telemóvel médio, em TODAS as aberturas (a rede tem cache; a compilação
       não). Agora só é carregado se o bundle pré-compilado faltar: ver o
       bootstrap no fim do <body>. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    body {
      font-family: 'Noto Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      overflow: hidden;
    }
    /* Eliminate the 300ms tap delay across all interactive elements */
    button, .tap { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    /* ══ WEB-D 皮 — A PALETA. ESTE BLOCO É A FONTE ÚNICA. ══════════════════
       Cada cor existe DUAS vezes: o tripleto `--X-rgb` (o valor) e `--X`
       (o mesmo, montado). Não é redundância — é a única forma de um
       `rgba(...,.35)` escrito numa aba chegar ao token. Um `--gold: var(--gold)`
       sozinho não sabe receber alpha: `var(--gold)88` é inválido
       *at-computed-value-time* e derruba a declaração INTEIRA em silêncio
       (lição R3/R5, paga duas vezes). Com o tripleto, `rgba(var(--gold-rgb),.35)`
       é CSS válido em qualquer browser que tenha `var()`.
       ⚠️ Mudar uma cor = mudar SÓ a linha `-rgb`. A linha `--X` deriva.
       ⚠️ O espelho em JS (`CSS_VAR_HEX`/`REALM_HEX` em ui.js) tem de acompanhar
       — existe porque o Telegram (`setHeaderColor`) e o alpha-concat pedem HEX
       literal, e há um teste que falha se os dois blocos divergirem. */
    :root {
      --realm-0-rgb: 156,163,175;  --realm-1-rgb: 96,165,250;  --realm-2-rgb: 251,191,36;
      --realm-3-rgb: 168,85,247;   --realm-4-rgb: 45,212,191;  --realm-5-rgb: 59,130,246;
      --realm-6-rgb: 139,92,246;   --realm-7-rgb: 245,158,11;  --realm-8-rgb: 56,189,248;
      --realm-9-rgb: 234,179,8;    --realm-10-rgb: 244,114,182;

      --bg-rgb: 6,8,15;            --card-rgb: 13,20,34;       --panel-rgb: 17,29,53;
      --border-rgb: 30,48,96;      --border2-rgb: 37,63,122;
      --text-rgb: 226,234,255;     --muted-rgb: 110,137,191;   --muted2-rgb: 61,90,158;
      --gold-rgb: 201,144,58;      --gold2-rgb: 245,201,122;   --gold3-rgb: 253,230,138;
      --jade-rgb: 62,207,126;      --red-rgb: 229,83,75;       --warn-rgb: 245,158,11;

      /* 牌 A CARTA 2026-09-05 — 朱砂, o selo de cinabrio.
         ⚠️ Este token NAO entra no `WARM_SKIN_RGB`, e isso e' decisao: o selo e'
         a ASSINATURA (`LINGUAGEM_VISUAL_WEB_C.md` §1), nao a moldura — vale o
         mesmo argumento que ja' protege as 11 `--realm-*` da pele quente
         ("identidade do jogo, nao moldura", `Mecanicas/miniapp.md` §1.6).
         Pintar o selo com `--accent2` daria um carimbo AZUL com a pele fria,
         porque `--accent2` frio e' #7896ff. O carimbo e' cinabrio nas duas
         peles, ou nao e' um carimbo.
         Nasce sem um unico leitor fora da carta ⇒ zero pixels mudados. */
      --seal-rgb: 200,68,47;

      /* WEB-D — sete tokens NOVOS. Não são invenção: são as sete cores mais
         escritas à mão no jogo que não tinham nome nenhum. Medido a
         2026-09-01 sobre tabs.js+ui.js+app.js+index.html. Sem nome, a paleta
         quente da V2.2 tocava o fundo e deixava 253 sítios azuis. */
      --surface-rgb: 20,28,50;     /* 36× — o painel elevado sobre o --card   */
      --surface2-rgb: 10,14,28;    /* 16× — o fundo do trilho / barra          */
      --surface3-rgb: 12,16,30;    /*  11× — o mais fundo (toast, modal)       */
      --glow-rgb: 60,90,180;       /* 51× — o halo ambiente do shell           */
      --text2-rgb: 220,230,255;    /* 41× — texto de destaque acima do --text  */
      --accent2-rgb: 120,150,255;  /* 27× — o acento frio (links, info)        */
      --red2-rgb: 252,165,165;     /* 71× — vermelho suave (dano, HP, recusa)  */

      /* O AMBIENTE — a maior superfície do jogo, e a que ficava azul.
         O fundo de constelação (céu + três cristas + o pagode) e a auréola do
         shell somam ~1440x900 e eram literais únicos: com a pele quente ligada
         o jogo inteiro aquecia e ficava uma montanha AZUL por cima, que é o
         "meio quente e meio azul" que o doc da linguagem visual proíbe.
         ⚠️ Os valores abaixo são EXACTAMENTE os de hoje — ligar isto não muda
         um pixel para os 248; só dá à pele um sítio por onde lhes pegar. */
      --amb-sky-rgb: 80,110,210;    /* o brilho do céu no topo               */
      --amb-ridge1-rgb: 100,130,200;/* crista distante (a mais clara)        */
      --amb-ridge2-rgb: 70,100,170; /* crista média                          */
      --amb-ridge3-rgb: 40,65,130;  /* crista próxima (a mais escura)        */
      --amb-pagoda-rgb: 80,110,180; /* o pagode na crista                    */
      --amb-aura-rgb: 140,80,200;   /* a auréola inferior do shell (app.js)  */

      --realm-0: rgb(var(--realm-0-rgb));   --realm-1: rgb(var(--realm-1-rgb));
      --realm-2: rgb(var(--realm-2-rgb));   --realm-3: rgb(var(--realm-3-rgb));
      --realm-4: rgb(var(--realm-4-rgb));   --realm-5: rgb(var(--realm-5-rgb));
      --realm-6: rgb(var(--realm-6-rgb));   --realm-7: rgb(var(--realm-7-rgb));
      --realm-8: rgb(var(--realm-8-rgb));   --realm-9: rgb(var(--realm-9-rgb));
      --realm-10: rgb(var(--realm-10-rgb));
      --bg: rgb(var(--bg-rgb));             --card: rgb(var(--card-rgb));
      --panel: rgb(var(--panel-rgb));       --border: rgb(var(--border-rgb));
      --border2: rgb(var(--border2-rgb));   --text: rgb(var(--text-rgb));
      --muted: rgb(var(--muted-rgb));       --muted2: rgb(var(--muted2-rgb));
      --gold: rgb(var(--gold-rgb));         --gold2: rgb(var(--gold2-rgb));
      --gold3: rgb(var(--gold3-rgb));       --jade: rgb(var(--jade-rgb));
      --red: rgb(var(--red-rgb));           --warn: rgb(var(--warn-rgb));
      --surface: rgb(var(--surface-rgb));   --surface2: rgb(var(--surface2-rgb));
      --surface3: rgb(var(--surface3-rgb)); --glow: rgb(var(--glow-rgb));
      --text2: rgb(var(--text2-rgb));       --accent2: rgb(var(--accent2-rgb));
      --red2: rgb(var(--red2-rgb));     --seal: rgb(var(--seal-rgb));
    }

    /* 坐 ONDA 1 — a respiração DISCRETA. A [013] tirou da cena os anéis
       expansivos e as partículas e deixou só isto: opacidade, 8s, e só
       enquanto o jogador está sentado. ⚠️ Não mexe em `transform`, logo
       não move a figura nem força repaint de layout — e um `prefers-
       reduced-motion` mata-a com o resto. */
    /* ♿ A REDUÇÃO DE MOVIMENTO, que NÃO EXISTIA. Medido a 2026-09-16: o
       ficheiro tinha **zero** ocorrências de `prefers-reduced-motion` e 20+
       `@keyframes` a correr sempre — incluindo pulsos de brilho e uma
       tempestade. Para quem pediu ao sistema operativo para não ter
       movimento (enxaqueca vestibular, epilepsia fotossensível), o jogo
       ignorava o pedido em TODAS as telas.

       ⚠️ `!important` e `.01ms` em vez de `none`: uma animação com
       `animation: none` nunca dispara `animationend`, e há código que
       espera por esse evento para continuar — matá-la a seco pendurava o
       fluxo. Um ciclo de 0,01ms termina de imediato E avisa. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @keyframes onda-breathe {
      0%, 100% { opacity: .9; }
      50%      { opacity: 1; }
    }
    /* 星 2.1 O CORPO — o gesto de ACENDER, e só ele. O desenho do Astra:
       o núcleo aparece em ~220 ms e um halo local dissolve-se até 600 ms,
       UMA vez, depois da confirmação do servidor. Não há brilho permanente —
       as marcas antigas ficam sólidas. Com movimento reduzido a regra de
       cima leva as duas ao estado final: o núcleo aceso e o halo apagado. */
    .corpo-nucleo-acende { animation: corpo-nucleo .22s cubic-bezier(.2,.8,.2,1) both; }
    .corpo-halo-acende   { animation: corpo-halo .6s ease-out both; }
    @keyframes corpo-nucleo {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes corpo-halo {
      from { transform: scale(1);   opacity: .9; }
      to   { transform: scale(2.8); opacity: 0; }
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.045); filter: brightness(1.18); }
    }
    /* R5 (ui_v2) — celebração de avanço: o Orbe da Alma "pulsa" 1× quando o
       Poder sobe. Substitui o orb-breathe durante o burst (mesmas propriedades
       — combinar conflitaria). Inerte fora do v2 (nenhum uso no v1). */
    @keyframes orb-burst {
      0%   { transform: scale(1);    filter: brightness(1); }
      25%  { transform: scale(1.14); filter: brightness(1.75); }
      55%  { transform: scale(0.99); filter: brightness(1.08); }
      100% { transform: scale(1);    filter: brightness(1); }
    }
    @keyframes orb-ring-out {
      0% { transform: scale(.85); opacity: .6; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    @keyframes orb-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes qi-rise {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: .85; }
      100% { transform: translateY(-110px) translateX(var(--dx, 18px)) scale(0); opacity: 0; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes constellation-twinkle {
      0%, 100% { opacity: .3; }
      50% { opacity: .9; }
    }
    @keyframes pop {
      0% { transform: scale(.9); opacity: 0; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(var(--gold2-rgb),.3); }
      50% { box-shadow: 0 0 16px rgba(var(--gold2-rgb),.6); }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 18px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(.5); opacity: .4; }
      40%           { transform: scale(1);  opacity: 1; }
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(.92) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    /* Breakthrough cinematic — 3 phases (charge → flash → reveal) */
    @keyframes bt-charge {
      0%   { transform: scale(1);    filter: brightness(1)   drop-shadow(0 0 6px rgba(var(--gold2-rgb),.5)); }
      50%  { transform: scale(1.18); filter: brightness(1.4) drop-shadow(0 0 22px rgba(var(--gold2-rgb),.95)); }
      100% { transform: scale(1.32); filter: brightness(1.8) drop-shadow(0 0 38px rgba(255,255,255,.98)); }
    }
    @keyframes bt-flash {
      0%   { background: rgba(255,255,255,0); }
      45%  { background: rgba(255,255,240,.95); }
      100% { background: rgba(255,255,255,0); }
    }
    @keyframes bt-shake-screen {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-6px); }
      30% { transform: translateX(7px); }
      45% { transform: translateX(-5px); }
      60% { transform: translateX(4px); }
      80% { transform: translateX(-2px); }
    }
    @keyframes bt-reveal {
      0%   { opacity: 0; transform: scale(.6) translateY(20px); }
      40%  { opacity: 1; transform: scale(1.08) translateY(0); }
      60%  { transform: scale(.98) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes bt-shake-horizontal {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    @keyframes bt-particle-rise {
      0%   { transform: translate(var(--ox,0), 0) scale(.6); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translate(var(--ox,0), -90px) scale(0); opacity: 0; }
    }
    @keyframes dng-pop {
      0%   { transform: scale(.78); opacity: 0; }
      60%  { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes dng-loot-cascade {
      0%   { transform: translateX(-8px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadein {
      0% { opacity: 0; } 100% { opacity: 1; }
    }
    /* MA-31 Alchemy + Heavenly Tribulation */
    @keyframes alch-pop {
      0%   { transform: scale(.6); opacity: 0; }
      50%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes alch-icon-spin {
      0%   { transform: rotate(0deg) scale(.6); opacity: 0; }
      60%  { transform: rotate(380deg) scale(1.18); opacity: 1; }
      100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
    @keyframes alch-icon-shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) rotate(-6deg); }
      30% { transform: translateX(8px)  rotate( 6deg); }
      45% { transform: translateX(-6px) rotate(-4deg); }
      60% { transform: translateX(6px)  rotate( 4deg); }
      75% { transform: translateX(-3px); }
    }
    @keyframes trib-storm {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1;   }
    }
    /* MA-34 Tribulation lightning cinematic — short flash on round result */
    @keyframes trib-lightning-flash {
      0%   { background: rgba(255,255,255,0); }
      30%  { background: rgba(220,235,255,.78); }
      55%  { background: rgba(180,200,255,.42); }
      80%  { background: rgba(220,235,255,.28); }
      100% { background: rgba(255,255,255,0); }
    }
    @keyframes trib-bolt-strike {
      0%   { transform: translateY(-40px) scale(.6); opacity: 0; filter: brightness(2.4); }
      40%  { transform: translateY(0) scale(1.15); opacity: 1; filter: brightness(1.6); }
      70%  { transform: translateY(0) scale(.96); opacity: 1; filter: brightness(1.1); }
      100% { transform: translateY(0) scale(1); opacity: 0; filter: brightness(1); }
    }
    @keyframes trib-shake-light {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-3px); }
      60% { transform: translateX(3px); }
    }
    @keyframes trib-pill-shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-4px) rotate(-3deg); }
      40% { transform: translateX(4px)  rotate( 3deg); }
      60% { transform: translateX(-3px) rotate(-2deg); }
      80% { transform: translateX(3px)  rotate( 2deg); }
    }
    @keyframes trib-action-flash {
      0%   { box-shadow: 0 0 0 0 currentColor; }
      40%  { box-shadow: 0 0 30px 6px currentColor; filter: brightness(1.4); }
      100% { box-shadow: 0 0 0 0 currentColor; filter: brightness(1); }
    }
    @keyframes forge-hint {
      0%, 100% { transform: translateY(0); opacity: .5; }
      50%      { transform: translateY(-3px); opacity: .75; }
    }
    /* v14.13c Item 2 — NotifToastStack push popups (top-anchored).
       Distinct from the bottom transient toast (which uses fadein). */
    @keyframes notif-toast-in {
      0%   { transform: translateY(-32px) scale(.96); opacity: 0; }
      60%  { transform: translateY(2px)   scale(1.02); opacity: 1; }
      100% { transform: translateY(0)     scale(1);    opacity: 1; }
    }
    /* MA-32 Forge / Artifacts */
    @keyframes forge-pop {
      0%   { transform: scale(.65) rotate(-4deg); opacity: 0; }
      55%  { transform: scale(1.1)  rotate( 2deg); opacity: 1; }
      100% { transform: scale(1)    rotate( 0deg); opacity: 1; }
    }
    /* Anvil-strike: sharp downward then bounce + flash. Used on success/perfect/divine icon. */
    @keyframes forge-anvil-strike {
      0%   { transform: translateY(-26px) scale(.6) rotate(-12deg); opacity: 0; filter: brightness(2); }
      45%  { transform: translateY(6px)   scale(1.18) rotate( 4deg); opacity: 1; filter: brightness(1.6); }
      65%  { transform: translateY(-3px)  scale(1.05); filter: brightness(1.25); }
      85%  { transform: translateY(2px)   scale(1.02); filter: brightness(1.05); }
      100% { transform: translateY(0)     scale(1); filter: brightness(1); }
    }
    /* Failure shake: heavier than the alchemy shake — the smith's frustration. */
    @keyframes forge-failure-shake {
      0%, 100% { transform: translateX(0)  rotate(0); }
      12% { transform: translateX(-9px)  rotate(-7deg); }
      24% { transform: translateX(9px)   rotate( 7deg); }
      38% { transform: translateX(-7px)  rotate(-5deg); }
      52% { transform: translateX(7px)   rotate( 5deg); }
      66% { transform: translateX(-4px)  rotate(-2deg); }
      80% { transform: translateX(4px)   rotate( 2deg); }
    }
    /* Spirit awakening shimmer — gold/violet alternating glow on the spirit
       awakened banner (rare event ≤0.1%, so we splash the celebration). */
    @keyframes forge-spirit-shimmer {
      0%   { box-shadow: 0 0 14px rgba(var(--gold2-rgb),.35), inset 0 0 18px rgba(var(--gold2-rgb),.12); }
      100% { box-shadow: 0 0 28px rgba(var(--realm-3-rgb),.55), inset 0 0 22px rgba(var(--realm-3-rgb),.16); }
    }
    .skel {
      background: linear-gradient(90deg, rgba(40,55,90,.35) 0%, rgba(70,95,150,.55) 50%, rgba(40,55,90,.35) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
      border-radius: 8px;
      border: 1px solid rgba(var(--glow-rgb),.18);
    }

    .scroll-area::-webkit-scrollbar { width: 0; height: 0; }
    .scroll-area { scrollbar-width: none; -webkit-overflow-scrolling: touch;
      /* Fix 2026-07-31 (report [jogador] + screenshot Saint: Salão/Perfil decepados
         à direita): rede de segurança contra conteúdo inquebrável mais largo
         que o card — palavras/URLs longas quebram em vez de esticar o layout.
         Complementa o minmax(0,1fr) dos grids-raiz dos modais (tabs.js). */
      overflow-wrap: anywhere; }
    /* HF-3 (2026-05-09): hide scrollbars on EVERY scrollable element across
       the mini-app. Owner reported the visible side bar inside the Rebirth
       and Sect Shop modals looked ugly on mobile. Native scrolling still
       works (kinetic + momentum); only the visual chrome is suppressed.
       Applied globally because the mini-app is a fixed-surface UI — there's
       no scenario where a visible scrollbar is part of the design. */
    *::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }

    /* ── WEB-C 兩面 — a superfície de desktop ────────────────────────────
       Um rato tem hover; um dedo não. Estas regras só têm efeito no trilho,
       que só existe fora do Telegram e num ponteiro fino — logo no telemóvel
       nenhuma delas chega a aplicar-se a nada. */
    .nv-rail-item:hover { background: rgba(var(--gold-rgb),.07) !important; color: var(--gold2) !important; }
    .nv-rail-item:focus-visible { outline: 1px solid var(--gold); outline-offset: -2px; }

    /* ── 圖 O MAPA — a porta de uma cena de hub ──────────────────────────
       Uma porta pintada TEM de ser alcancavel por Tab e TEM de se ver quando
       o foco la chega (V5 §3.6). O anel do agente existe por omissao, mas
       nasce quadrado por cima de uma peca redonda e some contra o ouro do
       nome; este e deliberado e segue o raio da chapa.
       ⚠️ A classe so existe no ramo LIGADO da flag: com `o_mapa` OFF nenhum
       elemento a usa e a regra nao alcanca nada. */
    .nv-door:focus-visible { outline: 2px solid var(--gold2); outline-offset: -6px;
                             border-radius: 12px; }
    /* Um rato tem hover; um dedo nao — no telemovel isto nunca se aplica. */
    .nv-door:hover { filter: brightness(1.12); }

    /* WEB-D §1 — a barra de deslocação do TRILHO volta a existir.
       MEDIDO 2026-09-01, a servir o jogo a sério: a 1280x720 (um portatil
       comum) o trilho tem 1131px de conteudo em 720px de altura e OITO
       destinos ficam por baixo da dobra — Mercado, Forja, Combate, Bestas,
       Passe, Loja, Noticias e Configuracoes. Com `*::-webkit-scrollbar{width:0}`
       global nao ha UM pixel a dizer que aquilo desliza: o jogador conclui que
       o jogo nao tem Loja nem Configuracoes. Isso e' a Lei No 1 (nunca preso
       sem caminho) partida por uma regra de CSS escrita para o telemovel — o
       esconderijo nasceu de um pedido do owner sobre modais no TELEMOVEL
       (HF-3, 2026-05-09), superficie onde o dedo ja diz que desliza.
       So aqui, so no ponteiro fino: o `.scroll-area` global continua a valer
       em todo o resto. A especificidade empata com `.scroll-area` (0,1,0) —
       e' a ORDEM no ficheiro que decide, por isso esta regra vive depois. */
    @media (min-width: 1024px) and (pointer: fine) {
      .nv-rail { scrollbar-width: thin; scrollbar-color: rgba(var(--gold-rgb),.34) transparent; }
      .nv-rail::-webkit-scrollbar { width: 8px; height: 8px; }
      .nv-rail::-webkit-scrollbar-track { background: transparent; }
      .nv-rail::-webkit-scrollbar-thumb {
        background: rgba(var(--gold-rgb),.28);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .nv-rail:hover::-webkit-scrollbar-thumb { background: rgba(var(--gold-rgb),.5); background-clip: content-box; }
    }

    /* ⚠️ `overflow:hidden` no body existe para o telemóvel (o WebView do
       Telegram usa o gesto vertical para si). Numa aba de browser larga não há
       gesto para roubar, e a barra de deslocação da página é a expectativa de
       quem usa rato. O shell continua a gerir o seu próprio scroll interno. */
    @media (min-width: 1024px) and (pointer: fine) {
      body { overscroll-behavior: auto; }
    }

    .err-banner {
      margin: 12px 0;
      padding: 10px 12px;
      background: rgba(var(--red-rgb),.12);
      border: 1px solid rgba(var(--red-rgb),.4);
      color: #ffb3ae;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
    }
    .toast {
      /* z acima de TODO modal (60/70/80/99999): o toast é o canal de erro dos
         fluxos DENTRO de modais empilhados — com z:50 ele nascia ATRÁS do
         modal e o jogador nunca via a recusa (report [jogador] 28/07). position
         segue absolute: mudar para fixed arriscaria ancestral com transform. */
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100000;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(var(--surface-rgb),.97), rgba(var(--surface3-rgb),.99));
      border: 1px solid var(--gold);
      border-radius: 10px;
      color: var(--gold2);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: .4px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 18px rgba(var(--gold-rgb),.25);
      animation: toast-in .25s ease-out;
      max-width: 320px;
      text-align: center;
    }
    .toast.err { border-color: var(--red); color: #ffb3ae; box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 18px rgba(var(--red-rgb),.25); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ─────────────────────────────────────────────────────────────────────
       Bootstrap. DOIS caminhos, e o segundo existe para NUNCA haver tela branca.

       CAMINHO RÁPIDO (o normal): `/miniapp/dist/bundle.js` — os três ficheiros
       já com o JSX transformado, concatenados pela mesma ordem, produzidos por
       `scripts/build_miniapp.mjs` na stage de node do Dockerfile. Zero
       compilação no aparelho, zero compilador descarregado.

       CAMINHO LENTO (o de antes): se o bundle não estiver lá — deploy que não
       correu o build, checkout de dev, imagem antiga — carrega-se o Babel **em
       runtime** e compila-se como sempre se compilou. Mais lento, mas VIVO.

       ⚠️ É por isto que não há flag. Uma flag é per-world e lê-se do servidor,
       e o arranque acontece ANTES da primeira chamada à API: pedir permissão
       para arrancar depressa custaria exactamente a ida ao servidor que se
       está a tentar poupar. O 404 é a permissão, e não precisa de painel.

       NÃO usamos `<script type="text/babel" src="...">`: o carregador externo
       do babel-standalone é frágil atrás de CDN/proxy e falha em silêncio
       (tela preta). Este pipeline explícito é determinístico e mostra o erro.
       ───────────────────────────────────────────────────────────────────── -->
  <script>
    (async () => {
      // Absolute paths — the page is served at `/miniapp` (no trailing slash),
      // so `./components/ui.js` resolves to `/components/ui.js` (404).
      const files = [
        "/miniapp/components/ui.js",
        "/miniapp/components/tabs.js",
        "/miniapp/components/app.js",
      ];

      const inject = (code, label) => {
        const tag = document.createElement("script");
        tag.text = code;
        if (label) tag.dataset.nvSource = label;
        document.head.appendChild(tag);
      };

      const loadScript = (src) => new Promise((ok, no) => {
        const el = document.createElement("script");
        el.src = src;
        el.onload = ok;
        el.onerror = () => no(new Error("falhou a carregar " + src));
        document.head.appendChild(el);
      });

      // ── Caminho rápido ────────────────────────────────────────────────────
      // ⚠️ Só um 200 conta. Um 404 vem COM CORPO (a nossa página de erro em
      // JSON), e injectá-lo como script seria um SyntaxError com o fallback já
      // gasto — o modo de falha exacto que este bloco existe para evitar.
      try {
        const r = await fetch("/miniapp/dist/bundle.js", { cache: "no-cache" });
        if (r.ok) {
          const code = await r.text();
          if (code && code.length > 1000) {
            inject(code, "bundle");
            window.__NV_BOOT = "bundle";
            return;
          }
          console.warn("[miniapp] bundle suspeito (" + code.length + " bytes) — a compilar em runtime");
        }
      } catch (e) {
        console.warn("[miniapp] bundle indisponivel — a compilar em runtime:", e && e.message);
      }

      // ── Caminho lento (o de sempre) ───────────────────────────────────────
      try {
        if (typeof Babel === "undefined") {
          await loadScript("https://unpkg.com/@babel/standalone@7.29.0/babel.min.js");
        }
        for (const url of files) {
          const r = await fetch(url, { cache: "no-cache" });
          if (!r.ok) throw new Error(url + " — HTTP " + r.status);
          const src = await r.text();
          inject(Babel.transform(src, { presets: ["react"] }).code, url);
        }
        window.__NV_BOOT = "babel";
      } catch (e) {
        console.error("[miniapp] bootstrap failed:", e);
        document.body.insertAdjacentHTML(
          "afterbegin",
          "<pre style=\"position:fixed;top:0;left:0;right:0;z-index:9999;margin:0;padding:14px;background:#7a1c1c;color:#ffe;font:12px monospace;white-space:pre-wrap\">"
            + "Mini-app failed to load:\n" + (e && e.message ? e.message : String(e))
            + "</pre>"
        );
      }
    })();
  </script>
</body>
</html>
